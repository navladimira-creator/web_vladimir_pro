[build]
  command = "npm run build"
  # Složka s hotovým webem. Přebíjí hodnotu uloženou v nastavení Netlify (tam byl kořen projektu,
  # což doplněk pro Next.js odmítne).
  publish = ".next"
  # Návrhy od Dependabotu (větve dependabot/*) se na Netlify nesestavují, šetří to kredity.
  # Ukončení 0 = sestavení přeskočit, jinak se sestaví.
  ignore = "case \"$HEAD\" in dependabot/*) exit 0;; *) exit 1;; esac"

# Doplněk, který z Next.js udělá fungující web na Netlify (serverová část). Výslovně zapnutý.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

# Staré adresy z Miowebu (301). Na Netlify platí s lomítkem i bez něj.
# /kontakt a /prihlaseni mají stejnou adresu i na novém webu.
[[redirects]]
  from = "/jednotlive-moduly"
  to = "/moduly"
  status = 301
  force = true

[[redirects]]
  from = "/eshop"
  to = "/moduly"
  status = 301
  force = true

[[redirects]]
  from = "/nastenka"
  to = "/clenska-sekce"
  status = 301
  force = true

[[redirects]]
  from = "/rezervace-konzultace"
  to = "/konzultace"
  status = 301
  force = true

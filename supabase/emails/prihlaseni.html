<!-- Supabase → Authentication → Email Templates → "Magic Link"
     Předmět: Tvůj přihlašovací odkaz -->
<div style="background:#041A1C;padding:32px 16px;font-family:Arial,Helvetica,sans-serif">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#0B2A2C;border:1px solid #1D4A4C;border-radius:20px">
    <tr><td style="padding:32px">
      <p style="margin:0 0 20px;font-size:18px;font-weight:700;color:#FFFFFF">Vladimír PRO</p>
      <h1 style="margin:0 0 16px;font-size:24px;line-height:1.25;color:#FFFFFF">Tvůj přihlašovací odkaz</h1>
      <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#B7D6D3">Klikni na tlačítko a přihlásíš se do členské sekce. Žádné heslo nepotřebuješ.</p>
      <p style="margin:0 0 24px">
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
           style="display:inline-block;background:#2DE2CB;color:#04201F;text-decoration:none;font-weight:700;font-size:16px;padding:14px 28px;border-radius:999px">Přihlásit se</a>
      </p>
      <p style="margin:0 0 8px;font-size:14px;line-height:1.6;color:#8FB9B5">Odkaz je jednorázový a platí 1 hodinu.</p>
      <p style="margin:0;font-size:14px;line-height:1.6;color:#8FB9B5">Pokud ses o přihlášení nežádal, tento e-mail ignoruj. Nic se nestane.</p>
    </td></tr>
  </table>
</div>

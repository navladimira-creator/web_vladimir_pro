name: Databázové migrace

# Po sloučení změn do main: jen ukáže, které migrace by se spustily (nic nemění).
# Skutečné spuštění: GitHub → Actions → Databázové migrace → Run workflow → akce „spustit“.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      akce:
        description: "jen-ukazat = jen vypíše, co by se spustilo; spustit = migrace opravdu proběhnou"
        type: choice
        options: [jen-ukazat, spustit]
        default: jen-ukazat

concurrency:
  group: migrace
  cancel-in-progress: false

jobs:
  migrace:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Propojení s projektem
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Co by se spustilo (nic se nemění)
        run: supabase db push --dry-run
      - name: Spuštění migrací
        if: github.event_name == 'workflow_dispatch' && inputs.akce == 'spustit'
        run: supabase db push
